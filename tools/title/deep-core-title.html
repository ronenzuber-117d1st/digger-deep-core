<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Core - Title Screen</title>
<style>
:root{--bg:#f4eed9;--fg:#1b1630;--mut:#5b5470;--line:#d9cfae;--acc:#a3262e}
:root[data-theme=dark]{--bg:#0d0b14;--fg:#f4eed9;--mut:#a9a3bd;--line:#43365f;--acc:#f7c94b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
header strong{letter-spacing:.08em;color:var(--acc)}
button{font:inherit;background:transparent;color:var(--fg);border:1px solid var(--line);padding:6px 12px;cursor:pointer;min-height:36px}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;min-height:0}
#stage{display:block;border:2px solid var(--line);background:#000;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.hint{color:var(--mut);font-size:12px;text-align:center}
details{max-width:960px;width:100%;color:var(--mut)}summary{cursor:pointer}
.sheet{image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--line);background:#000;max-width:100%;height:auto}
</style></head><body>

var stage=document.getElementById('stage'),mode='title',on=true,timer;
function fit(){var h=document.querySelector('header').offsetHeight+120;var z=Math.max(1,Math.floor(Math.min((innerWidth-40)/480,(innerHeight-h)/272)));stage.style.width=480*z+'px';stage.style.height=272*z+'px';}
function draw(){stage.src=mode==='menu'?M:(on?A:B);}
function blink(){if(mode==='title'){on=!on;draw();}}
function show(m){mode=m;on=true;draw();document.getElementById('hint').textContent=m==='menu'?'Main menu over the dimmed title (static preview). ESC returns to the title.':'SPACE or ENTER (or click) for the main menu. ESC returns to the title.';}
addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();if(mode==='title')show('menu');}else if(e.key==='Escape'&&mode==='menu')show('title');});
stage.addEventListener('click',function(){if(mode==='title')show('menu');});
document.getElementById('theme').onclick=function(){var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('dc-theme',r.dataset.theme)}catch(e){}};
try{var t=localStorage.getItem('dc-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
addEventListener('resize',fit);fit();draw();timer=setInterval(blink,500);
})();
